server:
  port: 8082
spring:
  application:
    name: campus-market-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/campus_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:campus-market-admin-dev-secret-change-me}
  expire-seconds: ${JWT_EXPIRE_SECONDS:86400}

app:
  cache:
    category-list-ttl-minutes: 60
    hot-goods-ttl-minutes: 10
  upload:
    base-dir: ${UPLOAD_BASE_DIR:uploads}
    public-prefix: /uploads
