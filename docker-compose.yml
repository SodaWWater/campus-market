services:
  mysql:
    image: mysql:8.0
    container_name: campus-market-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campus_market
    ports:
      - "3307:3306"
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/sample-data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro

  redis:
    image: redis:7
    container_name: campus-market-redis
    ports:
      - "6380:6379"
